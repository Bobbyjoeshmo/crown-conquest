:root {
  /* Layout idea: a chart room at night. The map is the table in the middle; the realm's ledgers sit to its left, the chronicler writes in a column on the right. One committed dark theme. */
  --ink: #0c181c; --panel: #132529; --panel-2: #1a3137; --line: #2c4a52;
  --paper: #ebe2cc; --muted: #9db0ab; --brass: #d4a94a; --danger: #dc6f59; --good: #6bb596;
  --sea: #17323a; --shoal: #25525c;
  --st-yours: #d4a94a; --st-ally: #5aa98c; --st-friend: #7ba6cc; --st-neutral: #aaa08c; --st-free: #818a6b; --st-enemy: #c4503e; --st-unknown: #1d363d;
  --brand: 'UnifrakturCook', 'Pirata One', 'Old English Text MT', Georgia, serif;
  --display: 'Pirata One', 'Almendra', 'Palatino Linotype', Georgia, serif;
  --map: 'Almendra', 'Palatino Linotype', Georgia, serif;
  --story: 'Almendra', 'Palatino Linotype', Georgia, serif;
  --ui: 'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--ink); color: var(--paper); font: 17px/1.45 var(--story); display: grid; grid-template-rows: auto minmax(0, 1fr); }
button, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; font-weight: 400; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- top bar ---------- */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #11242a, var(--ink)); }
.brand { display: flex; align-items: center; gap: 10px; line-height: 1.1; }
.brand .logo { width: 44px; height: auto; flex: none; }
.brand h1 { font-family: var(--brand); font-weight: 700; font-size: 31px; letter-spacing: 0.01em; color: var(--brass); line-height: 1; }
.brand h1 i { font-family: var(--display); font-style: normal; font-weight: 400; color: var(--paper); padding: 0 2px; font-size: 26px; }
.brand span { color: var(--muted); font-size: 15px; }
.res { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 420px; }
.pill, table.led, .legend, .tag, .keys, .fact h4, .field label, .teller, .tcount, .mapctl { font-family: var(--ui); }
.pill { display: flex; align-items: baseline; gap: 6px; padding: 4px 9px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); }
.pill b { font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.pill .v { font-size: 18px; font-weight: 700; }
.pill .d { font-size: 13px; color: var(--good); }
.pill .d.neg { color: var(--danger); }
.bar-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.btn { padding: 6px 14px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel-2); font-family: var(--display); font-size: 18px; letter-spacing: 0.02em; }
.btn[aria-pressed="true"] { border-color: var(--brass); color: var(--brass); }
.btn:hover { border-color: var(--brass); }
.btn.primary { background: var(--brass); border-color: var(--brass); color: #1a1405; font-weight: 700; }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: 0.45; cursor: default; }

/* ---------- main layout ---------- */
main { display: grid; grid-template-columns: 296px minmax(0, 1fr) 380px; min-height: 0; }
.leftcol { display: contents; }
.side { grid-column: 1; grid-row: 1; overflow-y: auto; border-right: 1px solid var(--line); min-height: 0; }
.center { grid-column: 2; grid-row: 1; overflow-y: auto; min-height: 0; padding: 14px 16px 18px; }
.chron { grid-column: 3; grid-row: 1; display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); background: var(--panel); }

/* ---------- map ---------- */
.mapwrap { background: var(--sea); border: 1px solid var(--line); border-radius: 4px; position: relative; overflow: hidden; }
#map { display: block; width: 100%; height: auto; max-height: 62vh; touch-action: none; cursor: grab; }
#map.drag { cursor: grabbing; }
#map.far .tname, #map.far .tcount, #map.far .binit { display: none; }
.mapctl { position: absolute; right: 8px; top: 8px; display: flex; gap: 4px; }
.mapctl button { min-width: 32px; height: 30px; padding: 0 9px; border: 1px solid var(--line); border-radius: 3px; background: rgba(12, 24, 28, 0.88); font-weight: 700; font-size: 14px; }
.mapctl button:hover { border-color: var(--brass); color: var(--brass); }
.halo { fill: none; stroke: var(--shoal); stroke-width: 11; stroke-linejoin: round; opacity: 0.55; }
.land { stroke: #0c181c; stroke-width: 1.4; stroke-linejoin: round; cursor: pointer; transition: filter 0.15s; }
.land:hover { filter: brightness(1.12); }
.land:focus-visible { outline: none; stroke: #fff; stroke-width: 3; }
.st-yours { fill: var(--st-yours); } .st-ally { fill: var(--st-ally); } .st-friend { fill: var(--st-friend); }
.st-neutral { fill: var(--st-neutral); } .st-free { fill: var(--st-free); } .st-enemy, .st-rebel { fill: url(#pwar); } .st-unknown { fill: url(#pfog); }
.selring { fill: none; stroke: #fff; stroke-width: 3.2; stroke-linejoin: round; pointer-events: none; }
.tname { font: italic 700 16px var(--map); fill: #14110a; text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: rgba(255, 250, 235, 0.5); stroke-width: 2.6px; stroke-linejoin: round; }
.tcount { font: 700 14px var(--ui); fill: #14110a; pointer-events: none; font-variant-numeric: tabular-nums; paint-order: stroke; stroke: rgba(255, 250, 235, 0.45); stroke-width: 2.2px; }
.binit { font: 700 9.5px var(--ui); fill: #fff; text-anchor: middle; pointer-events: none; }
.bdot { stroke: #0c181c; stroke-width: 1; pointer-events: none; }
.star { fill: #fff; stroke: #0c181c; stroke-width: 1; pointer-events: none; }

const EDITION = 'web';
/* ===== Crown & Conquest — world data and map geometry ===== */
'use strict';

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = n => Math.round(n).toLocaleString('en-US');

function mulberry(a) {

    a |= 0; a = a + 0x6D2B79F5 | 0;

/* ---------- Voronoi map with hand-drawn looking borders ---------- */
function clipCell(sites, i) {
  let pts = [[0, 0], [W, 0], [W, H], [0, H]], lab = [-1, -1, -1, -1];
  const s = sites[i];
  for (let j = 0; j < sites.length; j++) {
    if (j === i) continue;
    const o = sites[j], mx = (s[0] + o[0]) / 2, my = (s[1] + o[1]) / 2, nx = o[0] - s[0], ny = o[1] - s[1];
    const d = pts.map(p => (p[0] - mx) * nx + (p[1] - my) * ny);
    if (d.every(v => v <= 0)) continue;
    const np = [], nl = [], n = pts.length;
    for (let k = 0; k < n; k++) {
      const A = pts[k], B = pts[(k + 1) % n], da = d[k], db = d[(k + 1) % n], l = lab[k];
      if (da <= 0) {
        np.push(A); nl.push(l);
        if (db > 0) { const t = da / (da - db); np.push([A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t]); nl.push(j); }
      } else if (db <= 0) {
        const t = da / (da - db); np.push([A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t]); nl.push(l);
      }
    }
    pts = np; lab = nl;
    if (pts.length < 3) break;
  }
  return { pts, lab };
}
function centroid(p) {
  let a = 0, x = 0, y = 0;
  for (let i = 0; i < p.length; i++) {
    const q = p[(i + 1) % p.length], c = p[i][0] * q[1] - q[0] * p[i][1];
    a += c; x += (p[i][0] + q[0]) * c; y += (p[i][1] + q[1]) * c;
  }
  return a ? [x / (3 * a), y / (3 * a)] : p[0];
}
function noisy(A, B, rand, amp) {
  let pts = [A, B];
  for (let d = 0; d < 3; d++) {
    const np = [pts[0]];
    for (let k = 0; k < pts.length - 1; k++) {
      const p = pts[k], q = pts[k + 1], off = (rand() - 0.5) * 2 * amp;
      np.push([(p[0] + q[0]) / 2 - (q[1] - p[1]) * off, (p[1] + q[1]) / 2 + (q[0] - p[0]) * off], q);
    }
    pts = np;
  }
  return pts;
}

/* ---------- new game ---------- */
function newGame(opts) {

/* ---------- each game's lore: what a realm is famed for, its faith, its origins, old friendships and feuds ---------- */

/* ---------- economy ---------- */

    if (ci === P && c.taxTurn === S.turn) return { ok: false, msg: 'The tax rolls were already rewritten this season. Change them again next turn.' };
    const d = rate - c.tax; c.tax = rate; c.taxTurn = S.turn;

  invest(ci, area) {

/* ---------- a plain-text picture of the world, as the player knows it (given to the storyteller) ---------- */

/* ---------- carrying out the player's orders ---------- */
const norm = s => String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
function findTerr(name) {
  const n = norm(name); if (!n) return null;
  if (/^(my |our |the )?capital$/.test(n)) return S.terr[S.civs[P].capital];
  const seen = S.terr.filter(t => t.seen);
  return seen.find(t => norm(t.name) === n) || seen.find(t => n.includes(norm(t.name))) || seen.find(t => n.length >= 4 && norm(t.name).includes(n)) || null;
}
function findCiv(name) {
  const n = norm(name); if (!n) return null;
  const list = alive().filter(c => c.id !== P && c.met);
  return list.find(c => norm(c.short) === n) || list.find(c => n.includes(norm(c.short))) || list.find(c => norm(c.name).includes(n) && n.length >= 4) || list.find(c => norm(c.leader).split(' ').some(w => w.length > 3 && n.includes(w))) || null;

const fail = msg => ({ ok: false, msg });

function improvise(a) {

  const lacking = RES.filter(k => me.res[k] < costs[k]);

  if (lacking.length) return fail(`"${title}" would cost ${costText}, and you are short of ${lacking.join(' and ')}.`);

    } else if (e.kind === 'relation') { const c = findCiv(e.civ); if (c) resolved.push({ k: 'rel', c, foreign: c.id, soft: true, ch: clamp(ch, -30, Math.min(12, B * 0.8)) }); }
    else if (e.kind === 'rival_relation') { const c1 = findCiv(e.civ_a), c2 = findCiv(e.civ_b); if (c1 && c2 && c1 !== c2) resolved.push({ k: 'riv', c1, c2, foreign: c1.id, ch: clamp(ch, -Math.min(15, B), Math.min(10, B * 0.7)) }); }

    if (e.k === 'op') { bump(e.t, e.ch); notes.push(`opinion in ${e.t.name} ${sg(e.ch)}`); }
    if (e.k === 'rel') { addRel(P, e.c.id, e.ch); notes.push(`relations with ${e.c.short} ${sg(e.ch)}`); }
    if (e.k === 'riv') { addRel(e.c1.id, e.c2.id, e.ch); notes.push(`relations between ${e.c1.short} and ${e.c2.short} ${sg(e.ch)}`); }
  });

      <p>Welcome to Crown &amp; Conquest! This is a turn-based strategy game set in a fictional medieval world.</p>

      <h3>Your realm</h3>

      <div class="field"><label for="nRuler">Your title and name</label><input id="nRuler" maxlength="32" value="${esc(me ? me.leader : 'King Maren')}"></div>
      <fieldset class="colors"><legend>Your kingdom's colour on the map</legend>
        ${COLORS.map(c => `<label class="pickc"><input type="radio" name="nColor" value="${c[1]}"${(me && me.color ? me.color : '#d4a94a') === c[1] ? ' checked' : ''}><span style="background:${c[1]}"></span>${c[0]}</label>`).join('')}
        <label class="pickc"><input type="radio" name="nColor" value="custom"${me && me.color && !COLORS.some(c => c[1] === me.color) ? ' checked' : ''}><input type="color" id="nCustom" value="${esc(me && me.color ? me.color : '#d4a94a')}" aria-label="Pick your own colour">Your own</label>
      </fieldset>
      <fieldset class="colors diffs"><legend>Difficulty</legend>
        ${[['squire', 'Cheaper improvements, calmer neighbours, easier bargains, fewer disasters.'], ['knight', 'The standard game.'], ['lord', 'Dearer improvements, aggressive neighbours, hard bargains, more disasters and revolts.']].map(d => `<label class="pickc"><input type="radio" name="nDiff" value="${d[0]}"${((st() && st().diff) || 'knight') === d[0] ? ' checked' : ''}><b>${Game.DIFF[d[0]].label}</b><span style="all:unset">${d[1]}</span></label>`).join('')}
      </fieldset>
      <p class="hint">Battles follow the same rules on every difficulty. Enemies are always shown striped in red, so any colour stays easy to tell apart. Very dark colours are lightened a little so the map's lettering stays readable.</p>
      <div class="row"><button class="btn primary" type="submit">Start</button><button class="btn" type="button" data-close>Cancel</button></div></form>`);
  }
  function showOver() {
    const S = st(), o = S.over; if (!o) return;
    const win = o.result === 'win';
    modal(`<h2 id="mTitle">${win ? (o.how === 'alliance' ? 'The world at peace' : 'The world is yours') : 'Your realm has fallen'}</h2>
      <p>${win ? (o.how === 'alliance' ? `In ${Game.seasonName().toLowerCase()}, every territory on the map answers to you or to a ruler sworn to stand beside you. No banner is raised against the concord you built.` : `In ${Game.seasonName().toLowerCase()}, the last foreign banner comes down. Every territory in the known world is ruled from your court.`) : `In ${Game.seasonName().toLowerCase()}, your last territory changed hands and the ${esc(S.civs[0].name)} passed into the chronicles.`}</p>
      <p>The game lasted ${S.turn} turn${S.turn === 1 ? "" : "s"}.</p>
      <div class="row"><button class="btn primary" type="button" data-new>Play again</button><button class="btn" type="button" data-close>Look at the map</button></div>`);
    renderBar();
  }
  function intro() {
    const S = st(), me = S.civs[0], cap = S.terr[me.capital];
    Game.log('gm', `You are ${me.leader}, newly raised to rule the ${me.name}. Four territories answer to you, and ${cap.name} is your capital. ${Game.loreOf(0).join(' ')} Beyond your borders lie free peoples, six rival courts you have yet to meet, and a great deal of blank map.`);
    Game.log('ok', EDITION === 'web' ? 'Type commands in the box below, such as "recruit 200 in ' + cap.name + '" or "talk to my advisor". Press All commands for the full list, or click any territory on the map for ready-made orders. When you have done all you wish this season, press End turn.' : 'Write what you want to do in the box below, in your own words, as you would tell a game master. Click any territory on the map to read about it. When you have done all you wish this season, press End turn.');
    Game.log('ok', 'You win by holding every territory in the world, alone or together with rulers who share a military pact with you.');
  }

  /* ---------- wiring ---------- */
  document.addEventListener('click', e => {
    const q = s => e.target.closest(s);
    let el;
    if ((el = q('[data-sel]'))) {
      const onMap = !!el.closest('#map');
      if (onMap && suppressClick) { suppressClick = false; return; }
      sel = +el.dataset.sel; if (!onMap) ensureVisible(sel);
      renderMap(); renderSheet(); if (tab === 'realm') renderLedger(); return;
    }
    if ((el = q('[data-zoom]'))) { const z = el.dataset.zoom; if (z === 'in') zoomBy(1 / 1.35); else if (z === 'out') zoomBy(1.35); else if (z === 'home') homeView(); else setView({ x: 0, y: 0, w: W }); return; }
    if (q('#btnMusic')) { toggleMusic(); return; }
    if (q('#btnSound')) { toggleSound(); return; }
    if ((el = q('[data-fill]'))) { if (el.hasAttribute('data-close')) closeModal(); const ta = $('#cmdText'); ta.value = el.dataset.fill; ta.focus(); return; }
    if ((el = q('[data-say]'))) { sceneSay(el.dataset.say); return; }
    if ((el = q('[data-tab]'))) { tab = el.dataset.tab; renderLedger(); return; }
    if ((el = q('[data-meet]'))) { if (busy || scene || st().over) return; sceneQueue.push(JSON.parse(el.dataset.meet)); nextScene(); return; }
    if (q('[data-close]')) { closeModal(); return; }
    if (q('[data-cmds]')) { showCommands(); return; }
    if (q('[data-new]')) { showNew(false); return; }
    if (q('#scClose')) { closeScene(); return; }
    if (q('#btnEnd')) { endTurn(); return; }
    if (q('#btnHelp')) { showHelp(false); return; }
    if (q('[data-setup]')) { showNew(true); return; }
    if (q('#btnNew')) { showNew(false); return; }
  });
  document.addEventListener('submit', e => {
    e.preventDefault();
    if (e.target.id === 'cmd') { const ta = $('#cmdText'), v = ta.value; ta.value = ''; submit(v); }
    else if (e.target.id === 'scForm') { const ta = $('#scText'), v = ta.value; ta.value = ''; sceneSay(v); }
    else if (e.target.id === 'newForm') {
      const realm = $('#nRealm').value, ruler = $('#nRuler').value, picked = document.querySelector('input[name="nColor"]:checked');
      const dsel = document.querySelector('input[name="nDiff"]:checked'), diff = dsel ? dsel.value : 'knight';
      const color = readable(picked ? (picked.value === 'custom' ? $('#nCustom').value : picked.value) : '#d4a94a');
      closeModal(); scene = null; sceneQueue.length = 0; renderScene();
      Game.newGame({ realm, ruler, color, diff }); intro(); sel = st().civs[0].capital; save(); applyColor(); renderAll(); homeView();
    }
  });
  document.addEventListener('keydown', e => {
    gesture(e);
    if (e.key === 'Enter' && !e.shiftKey && (e.target.id === 'cmdText' || e.target.id === 'scText')) { e.preventDefault(); e.target.form.requestSubmit(); }
    else if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.land')) { e.preventDefault(); sel = +e.target.dataset.sel; renderMap(); renderSheet(); }
    else if (e.key === 'Escape') { if (!$('#modal').hidden) closeModal(); else if (scene && !scene.pending) closeScene(); }
  });

  document.addEventListener('input', e => { if (e.target.id === 'nCustom') { const r = document.querySelector('input[name="nColor"][value="custom"]'); if (r) r.checked = true; } });
  document.addEventListener('change', e => { if (e.target.id === 'tellerMode') { AI.mode = e.target.value; setPref('teller', AI.mode); renderLog(); renderIdeas(); } });

  /* ---------- moving about the map ---------- */
  let suppressClick = false;
  (function () {
    const svg = $('#map'), ptrs = new Map();
    let drag = null, pinch = null;
    const world = (x, y) => { const p = svg.createSVGPoint(); p.x = x; p.y = y; return p.matrixTransform(svg.getScreenCTM().inverse()); };
    svg.addEventListener('pointerdown', e => {
      ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (ptrs.size === 1) { const m = svg.getScreenCTM(); drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, k: m ? m.a : 1, moved: false }; }
      else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, w: view.w, c: world((a.x + b.x) / 2, (a.y + b.y) / 2) }; if (drag) drag.moved = true; }
    });
    svg.addEventListener('pointermove', e => {
      if (!ptrs.has(e.pointerId)) return;
      ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (ptrs.size >= 2 && pinch) {
        const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y) || 1, w = clamp(pinch.w * pinch.d / d, 420, W), k = w / view.w;
        setView({ w, x: pinch.c.x - (pinch.c.x - view.x) * k, y: pinch.c.y - (pinch.c.y - view.y) * k });
      } else if (drag) {
        const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
        if (!drag.moved && Math.abs(dx) + Math.abs(dy) > 7) { drag.moved = true; svg.classList.add('drag'); }
        if (drag.moved) setView({ w: view.w, x: drag.vx - dx / drag.k, y: drag.vy - dy / drag.k });
      }
    });
    const up = e => {
      ptrs.delete(e.pointerId);
      if (ptrs.size < 2) pinch = null;
      if (!ptrs.size) { if (drag && drag.moved) { suppressClick = true; setTimeout(() => { suppressClick = false; }, 60); } drag = null; svg.classList.remove('drag'); }
    };
    svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up); svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') up(e); });
    svg.addEventListener('wheel', e => { e.preventDefault(); const p = world(e.clientX, e.clientY); zoomBy(e.deltaY > 0 ? 1.18 : 1 / 1.18, p.x, p.y); }, { passive: false });
  })();

  /* ---------- music ---------- */
  let pendingMusic = false, tuning = false;
  function soundLabels() {
    const m = $('#btnMusic'), f = $('#btnSound');
    m.textContent = 'Music: ' + (tuning ? 'tuning…' : Sound.musicOn ? 'on' : 'off'); m.setAttribute('aria-pressed', Sound.musicOn ? 'true' : 'false');
    f.textContent = 'Sounds: ' + (Sound.fxOn ? 'on' : 'off'); f.setAttribute('aria-pressed', Sound.fxOn ? 'true' : 'false');
  }
  async function setMusic(on) {
    pendingMusic = false;
    if (tuning) return;
    tuning = on; soundLabels();
    let ok = false;
    try { ok = await Sound.music(on); } catch (e) { ok = false; }
    tuning = false;
    if (on && !ok) Game.log('fail', 'This browser would not play the music.');
    soundLabels();
  }
  function toggleMusic() { const on = !Sound.musicOn; setPref('music', on); setMusic(on); }
  function toggleSound() { Sound.setFx(!Sound.fxOn); setPref('fx', Sound.fxOn); soundLabels(); if (Sound.fxOn) Sound.fx('book'); }
  function gesture(e) {
    Sound.unlock();
    if (pendingMusic && !(e.target.closest && e.target.closest('#btnMusic'))) setMusic(true);
  }
  document.addEventListener('pointerdown', gesture);

  if (EDITION === 'web') {
    const t = document.querySelector('.teller'); if (t) t.innerHTML = '<button class="btn" type="button" data-cmds style="font-size:16px;padding:3px 12px">All commands</button>';
  }
  function start(data) {
    let ok = false;
    const pf = prefs();
    if (['full', 'light', 'off'].includes(pf.teller)) AI.mode = pf.teller;
    pendingMusic = pf.music === true;
    Sound.setFx(pf.fx !== false);
    try { if (data && data.v === 3 && Array.isArray(data.terr)) ok = Game.load(data); } catch (e) { ok = false; }
    if (!ok) { const s = loadSaved(); try { if (s) ok = Game.load(s); } catch (e) { ok = false; } }
    if (!ok) { Game.newGame({}); intro(); }
    sel = st().civs[0].capital;
    applyColor(); renderAll(); homeView(); soundLabels();
    Story.aiReady.then(() => { renderLog(); renderIdeas(); });
    if (st().over) showOver(); else nextScene();
    if (!pf.seenHelp && !st().over && !scene) { showHelp(true); setPref('seenHelp', true); }
  }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => Game.state);
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
  window.__cc = { Game, Story, Sound, Art, submit, endTurn };
})();

</script>
</body>
</html>
